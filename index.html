<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karkhana Pagar Pro - Mahi Fashion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { padding-bottom: 80px; background-color: #f8fafc; font-family: sans-serif; }
        @media (min-width: 768px) { body { padding-bottom: 0; padding-top: 70px; } }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #toast { pointer-events: none; transition: opacity 0.3s ease; }
    </style>
</head>
<body>

    <!-- Desktop Navbar -->
    <nav class="hidden md:flex fixed top-0 w-full bg-indigo-900 text-white shadow-md z-50 px-6 py-4 justify-between items-center">
        <div class="font-bold text-xl flex items-center gap-2">
            <i class="fa-solid fa-industry text-yellow-400"></i> Karkhana Pagar Pro
        </div>
        <div class="flex space-x-6 font-medium">
            <button onclick="switchTab('dashboard')" class="hover:text-yellow-300 transition">Dashboard</button>
            <button onclick="switchTab('haziri')" class="hover:text-yellow-300 transition">Haziri & Bonus</button>
            <button onclick="switchTab('upad')" class="hover:text-yellow-300 transition">Upad</button>
            <button onclick="switchTab('reports')" class="hover:text-yellow-300 transition">Reports</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="p-4 md:p-6 max-w-6xl mx-auto z-10 relative">

        <!-- 1. DASHBOARD -->
        <section id="dashboard" class="tab-content active">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Mahine ka Hisab</h2>
                <button onclick="renderDashboard()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg shadow hover:bg-indigo-700">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
            <div id="dashboardCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Cards will render here -->
            </div>
        </section>

        <!-- 2. HAZIRI ENTRY -->
        <section id="haziri" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Haziri, Machine & Bonus Entry</h2>
            <form onsubmit="saveAttendance(event)" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-4">
                    
                    <div><label class="block text-sm font-semibold mb-1">Date *</label>
                    <input type="date" id="h_date" required class="w-full border p-2.5 rounded-lg bg-slate-50"></div>
                    
                    <div><label class="block text-sm font-semibold mb-1">Pagar Mode *</label>
                    <select id="h_mode" onchange="toggleWorker2()" class="w-full border p-2.5 rounded-lg bg-slate-50">
                        <option value="Full">Full Pagar + Bonus</option>
                        <option value="StitchOnly">Sirf Stitch Bonus (Extra M/C)</option>
                        <option value="Shared50">Shared 50-50 (2 Worker = 1 M/C)</option>
                    </select></div>

                    <div><label class="block text-sm font-semibold mb-1">Main Worker *</label>
                    <select id="h_worker1" required class="w-full border p-2.5 rounded-lg bg-slate-50"></select></div>

                    <div id="worker2_div" class="hidden"><label class="block text-sm font-semibold mb-1 text-indigo-600">Dusra Worker (50%) *</label>
                    <select id="h_worker2" class="w-full border border-indigo-300 p-2.5 rounded-lg bg-indigo-50"></select></div>
                    
                    <div><label class="block text-sm font-semibold mb-1">Shift</label>
                    <select id="h_shift" class="w-full border p-2.5 rounded-lg bg-slate-50">
                        <option value="Day">Day Shift</option><option value="Night">Night Shift</option>
                    </select></div>

                    <div><label class="block text-sm font-semibold mb-1">Machine Type *</label>
                    <select id="h_machine" class="w-full border p-2.5 rounded-lg bg-slate-50">
                        <option value="25">Type 25 (Rate: 1.75)</option>
                        <option value="32">Type 32 (Rate: 2.00)</option>
                        <option value="BEAD ALLOVER">BEAD ALLOVER</option>
                        <option value="ALTER">ALTER (Hourly)</option>
                    </select></div>

                    <div><label class="block text-sm font-semibold mb-1">Design Code</label>
                    <input type="text" id="h_design" placeholder="Jaise: DSN-101" class="w-full border p-2.5 rounded-lg bg-slate-50"></div>

                    <div><label class="block text-sm font-semibold mb-1">Total Stitches / Hours *</label>
                    <input type="number" id="h_qty" required placeholder="Ex: 200000" class="w-full border p-2.5 rounded-lg bg-slate-50"></div>

                    <div><label class="block text-sm font-semibold mb-1">Machine Frame</label>
                    <input type="number" id="h_frame" placeholder="Ex: 20 ya 25" class="w-full border p-2.5 rounded-lg bg-slate-50"></div>

                    <div><label class="block text-sm font-semibold mb-1 text-emerald-600">Custom/Extra Bonus (₹)</label>
                    <input type="number" id="h_custom" value="0" class="w-full border p-2.5 rounded-lg bg-emerald-50"></div>

                    <div class="md:col-span-2"><label class="block text-sm font-semibold mb-1 text-red-600">Sikayat / Note (Bohot Zaroori)</label>
                    <input type="text" id="h_note" placeholder="Worker ki sikayat ya entry ki wajah yahan likhein..." class="w-full border p-2.5 rounded-lg bg-red-50"></div>

                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save Entry (Phone + Google Sheet)
                </button>
            </form>
        </section>

        <!-- 3. UPAD ENTRY -->
        <section id="upad" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Upad (Advance)</h2>
            <form onsubmit="saveUpad(event)" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                    <div><label class="block text-sm font-semibold mb-1">Date *</label><input type="date" id="u_date" required class="w-full border p-2.5 rounded-lg bg-slate-50"></div>
                    <div><label class="block text-sm font-semibold mb-1">Worker *</label><select id="u_worker" class="w-full border p-2.5 rounded-lg bg-slate-50"></select></div>
                    <div><label class="block text-sm font-semibold mb-1 text-red-600">Amount (₹) *</label><input type="number" id="u_amount" required class="w-full border border-red-200 p-2.5 rounded-lg bg-red-50"></div>
                    <div><label class="block text-sm font-semibold mb-1">Mode & Wajah</label><input type="text" id="u_note" placeholder="Cash / Gpay, Medical..." class="w-full border p-2.5 rounded-lg bg-slate-50"></div>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition">
                    <i class="fa-solid fa-money-bill-transfer"></i> Save Upad
                </button>
            </form>
        </section>

        <!-- 4. REPORTS -->
        <section id="reports" class="tab-content">
            <h2 class="text-2xl font-bold mb-4 text-slate-800">Reports Ledger</h2>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px] text-sm">
                    <thead>
                        <tr class="bg-indigo-50 text-indigo-900 border-b-2 border-indigo-200">
                            <th class="p-3">Worker</th>
                            <th class="p-3">Pagar Bacha (₹)</th>
                            <th class="p-3">Total Upad (₹)</th>
                            <th class="p-3 text-red-600">Sikayat / Notes</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden fixed bottom-0 w-full bg-white border-t border-slate-200 flex justify-around text-xs font-medium z-[100] pb-2 pt-2 shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('dashboard')" class="flex flex-col items-center p-2 text-indigo-700 w-1/4"><i class="fa-solid fa-chart-pie text-lg mb-1"></i> Dashboard</button>
        <button onclick="switchTab('haziri')" class="flex flex-col items-center p-2 text-slate-500 hover:text-indigo-700 w-1/4"><i class="fa-solid fa-calendar-check text-lg mb-1"></i> Haziri</button>
        <button onclick="switchTab('upad')" class="flex flex-col items-center p-2 text-slate-500 hover:text-indigo-700 w-1/4"><i class="fa-solid fa-wallet text-lg mb-1"></i> Upad</button>
        <button onclick="switchTab('reports')" class="flex flex-col items-center p-2 text-slate-500 hover:text-indigo-700 w-1/4"><i class="fa-solid fa-file-lines text-lg mb-1"></i> Reports</button>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-xl opacity-0 z-[110] font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i> <span id="toastMsg">Saved!</span>
    </div>

    <!-- MAIN JAVASCRIPT LOGIC -->
    <script>
        // =========================================================================
        // 🚨 YAHAN APNA GOOGLE APPS SCRIPT URL PASTE KAREIN 🚨
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-Z5kgHCgxH37DyvPk8Ljc24-9eYZDF6EC0Pr9R431gAUlLJSW0-p0jRX9OWFr4kFQuQ/exec'; 
        // =========================================================================

        let workers = [
            { id: "W1", name: "Ramesh Bhai", fixSalary: 18000, rule: "30Days" },
            { id: "W2", name: "Suresh Kumar", fixSalary: 15000, rule: "SundayOff" },
            { id: "W3", name: "Mahesh Patel", fixSalary: 16000, rule: "30Days" }
        ];
        
        let attendance = JSON.parse(localStorage.getItem('karkhana_att')) || [];
        let upad = JSON.parse(localStorage.getItem('karkhana_upad')) || [];

        function initApp() {
            document.getElementById('h_date').valueAsDate = new Date();
            document.getElementById('u_date').valueAsDate = new Date();
            
            let wHtml = workers.map(w => `<option value="${w.id}">${w.name}</option>`).join('');
            document.getElementById('h_worker1').innerHTML = wHtml;
            document.getElementById('h_worker2').innerHTML = wHtml;
            document.getElementById('u_worker').innerHTML = wHtml;
            
            renderDashboard();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            
            // Mobile styling update
            if(window.innerWidth < 768) {
                document.querySelectorAll('nav.md\\:hidden button').forEach(b => {
                    b.classList.remove('text-indigo-700'); b.classList.add('text-slate-500');
                });
                event.currentTarget.classList.add('text-indigo-700');
            }
            if(tabId === 'dashboard') renderDashboard();
            if(tabId === 'reports') renderDashboard(); // Uses same logic for simple report
        }

        function toggleWorker2() {
            let mode = document.getElementById('h_mode').value;
            let w2Div = document.getElementById('worker2_div');
            if(mode === 'Shared50') {
                w2Div.classList.remove('hidden');
            } else {
                w2Div.classList.add('hidden');
            }
        }

        function calculateAutoBonus(machine, qtyStr) {
            let qty = parseFloat(qtyStr) || 0;
            let bonus = 0;
            if(machine === '25') {
                if(qty > 185000) bonus = ((qty - 185000) / 1000) * 1.75;
            } else if (machine === '32') {
                if(qty > 185000) bonus = ((qty - 185000) / 1000) * 2.0;
            } else if (machine === 'ALTER') {
                bonus = qty * 120; // Hourly
            } else if (machine === 'BEAD ALLOVER') {
                if(qty > 250000) bonus = ((qty - 250000) / 1000) * 1.0;
            }
            return bonus;
        }

        // ====== GOOGLE SHEET MEIN BHEJNE WALA FETCH FUNCTION ======
        function sendToGoogleSheet(sheetName, rowData) {
            if(SCRIPT_URL && SCRIPT_URL !== 'MERA_COPIED_URL_YAHAN_PASTE_KAREIN') {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // CORS error se bachne ke liye
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sheet: sheetName, rowData: rowData })
                }).then(() => console.log("Sent to Google Sheets: " + sheetName))
                  .catch(e => console.error("Network error: ", e));
            }
        }

        function saveAttendance(event) {
            event.preventDefault();
            let date = document.getElementById('h_date').value;
            let mode = document.getElementById('h_mode').value;
            let shift = document.getElementById('h_shift').value;
            let machine = document.getElementById('h_machine').value;
            let qty = document.getElementById('h_qty').value;
            let design = document.getElementById('h_design').value || "-";
            let frame = document.getElementById('h_frame').value || "-";
            let customBonus = parseFloat(document.getElementById('h_custom').value) || 0;
            let note = document.getElementById('h_note').value || "-";
            
            let w1 = document.getElementById('h_worker1').value;
            let autoBonus = calculateAutoBonus(machine, qty);
            let finalBonus = autoBonus + customBonus;

            // Agar Shared 50-50 hai, to 2 entry banegi
            if(mode === 'Shared50') {
                let w2 = document.getElementById('h_worker2').value;
                let halfBonus = finalBonus / 2;
                
                // W1 ki entry
                let entry1 = { date, workerId: w1, mode, shift, machine, qty, design, frame, customBonus: customBonus/2, finalBonus: halfBonus, note };
                attendance.push(entry1);
                sendToGoogleSheet("Haziri", [date, workers.find(w=>w.id===w1).name, shift, mode, machine, qty, design, frame, customBonus/2, halfBonus, note]);

                // W2 ki entry
                let entry2 = { date, workerId: w2, mode, shift, machine, qty, design, frame, customBonus: customBonus/2, finalBonus: halfBonus, note };
                attendance.push(entry2);
                sendToGoogleSheet("Haziri", [date, workers.find(w=>w.id===w2).name, shift, mode, machine, qty, design, frame, customBonus/2, halfBonus, note]);
                
            } else {
                let entry = { date, workerId: w1, mode, shift, machine, qty, design, frame, customBonus, finalBonus, note };
                attendance.push(entry);
                sendToGoogleSheet("Haziri", [date, workers.find(w=>w.id===w1).name, shift, mode, machine, qty, design, frame, customBonus, finalBonus, note]);
            }

            localStorage.setItem('karkhana_att', JSON.stringify(attendance));
            showToast("Haziri Saved! Bonus: ₹" + finalBonus.toFixed(0));
            
            document.getElementById('h_qty').value = '';
            document.getElementById('h_note').value = '';
        }

        function saveUpad(event) {
            event.preventDefault();
            let date = document.getElementById('u_date').value;
            let workerId = document.getElementById('u_worker').value;
            let amount = parseFloat(document.getElementById('u_amount').value) || 0;
            let note = document.getElementById('u_note').value || "-";
            
            let entry = { date, workerId, amount, note };
            upad.push(entry);
            localStorage.setItem('karkhana_upad', JSON.stringify(upad));
            
            sendToGoogleSheet("Upad", [date, workers.find(w=>w.id===workerId).name, amount, "-", note]);
            
            showToast("Upad ₹" + amount + " Saved!");
            document.getElementById('u_amount').value = '';
            document.getElementById('u_note').value = '';
        }

        function renderDashboard() {
            let dashHtml = '';
            let repHtml = '';

            workers.forEach(w => {
                let wAtt = attendance.filter(a => a.workerId === w.id);
                let wUpad = upad.filter(u => u.workerId === w.id);
                
                let effectiveDays = wAtt.filter(a => a.mode === 'Full').length + (wAtt.filter(a => a.mode === 'Shared50').length / 2);
                
                // Mahina average 30 din maan kar
                let earnedSalary = (w.fixSalary / 30) * effectiveDays;
                let totalBonus = wAtt.reduce((sum, a) => sum + (a.finalBonus || 0), 0);
                let totalUpad = wUpad.reduce((sum, u) => sum + (u.amount || 0), 0);
                
                let net = (earnedSalary + totalBonus) - totalUpad;
                let isNegative = net < 0;
                
                // Check if any complaint note exists
                let sikayatList = wAtt.filter(a => a.note !== '-' && a.note !== '').map(a => a.note);
                let hasSikayat = sikayatList.length > 0;

                dashHtml += `
                <div class="border rounded-xl p-5 bg-white shadow-sm ${isNegative ? 'border-red-400 bg-red-50' : ''}">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-lg">${w.name}</h3>
                        ${hasSikayat ? '<span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded font-bold"><i class="fa-solid fa-triangle-exclamation"></i> Sikayat Hai</span>' : ''}
                    </div>
                    <div class="space-y-1 text-sm text-slate-600 mb-4 border-b pb-3">
                        <div class="flex justify-between"><span>Base Haziri:</span> <span class="font-medium">₹${earnedSalary.toFixed(0)}</span></div>
                        <div class="flex justify-between"><span>Kul Bonus:</span> <span class="font-medium text-emerald-600">+ ₹${totalBonus.toFixed(0)}</span></div>
                        <div class="flex justify-between"><span>Upad:</span> <span class="font-medium text-red-500">- ₹${totalUpad.toFixed(0)}</span></div>
                    </div>
                    <div class="flex justify-between font-bold text-lg ${isNegative ? 'text-red-600' : 'text-indigo-700'}">
                        <span>Net Baki:</span> <span>₹${net.toFixed(0)}</span>
                    </div>
                </div>`;

                repHtml += `
                <tr class="border-b border-slate-100 hover:bg-slate-50">
                    <td class="p-3 font-semibold">${w.name}</td>
                    <td class="p-3 font-bold ${isNegative?'text-red-500':'text-emerald-600'}">₹${net.toFixed(0)}</td>
                    <td class="p-3 text-slate-600">₹${totalUpad.toFixed(0)}</td>
                    <td class="p-3 text-xs text-red-500 font-medium">${sikayatList.join('<br>') || '-'}</td>
                </tr>`;
            });

            document.getElementById('dashboardCards').innerHTML = dashHtml;
            if(document.getElementById('reportTableBody')) document.getElementById('reportTableBody').innerHTML = repHtml;
        }

        function showToast(msg) {
            let t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('opacity-0');
            setTimeout(() => { t.classList.add('opacity-0'); }, 3000);
        }

        initApp();
    </script>
</body>
</html>
